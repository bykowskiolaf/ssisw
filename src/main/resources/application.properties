spring.application.name=ssisw

# Run with --cars.import.enabled=true to download and generate the dataset.
cars.import.enabled=false
cars.import.count=80
cars.import.newest-year=2025
cars.import.output=data/cars.json
cars.import.vpic-base-url=https://vpic.nhtsa.dot.gov/api

# Run with --simulation.enabled=true to start the one-shot JADE marketplace.
simulation.enabled=false
simulation.dataset-path=data/cars.json
simulation.buyer-budget-pln=300000
simulation.reservation-duration-ms=5000
simulation.timeout-seconds=30
simulation.jade-gui=false
